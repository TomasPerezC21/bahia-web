<footer class="footer">

  <!-- Top -->
  <div class="footer__top container">

    <div class="footer__brand">
      <img src="media/logo-sinfondo.png" alt="Bahia" class="footer__logo" />
      <p class="footer__tagline">
        Trajes de baño con alma familiar.<br>
        Hecho con amor junto al mar. 🤍
      </p>
    </div>

    <div class="footer__cols">
      @for (col of columns; track col.title) {
      <div class="footer__col">
        <h4 class="footer__col-title">{{ col.title }}</h4>
        @for (link of col.links; track link) {
        <a href="#" class="footer__link">{{ link }}</a>
        }
      </div>
      }
    </div>

  </div>

  <!-- Bottom -->
  <div class="footer__bottom">
    <div class="container">
      <p class="footer__copy">© {{ year }} Bahia. Todos los derechos reservados.</p>
      <div class="footer__legal">
        <a href="#" class="footer__legal-link">Privacidad</a>
        <a href="#" class="footer__legal-link">Cookies</a>
        <a href="#" class="footer__legal-link">Aviso legal</a>
      </div>
    </div>
  </div>

</footer>
