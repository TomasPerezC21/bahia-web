<section class="hero">
  <div class="hero__content container">

    <div class="hero__text">
      <p class="hero__eyebrow">Colección Verano 2026</p>
      <h1 class="hero__title">
        Hecha para<br>
        <em>el mar</em>
      </h1>
      <p class="hero__subtitle">
        Bikinis y trajes de baño artesanales. Tejidos suaves,
        diseños atemporales y tallas para todas.
      </p>
      <div class="hero__actions">
        <button mat-raised-button class="hero__btn-primary" id="hero-cta-shop">
          Ver Colección
          <span class="material-icons">arrow_forward</span>
        </button>
        <button mat-button class="hero__btn-secondary" id="hero-cta-about">
          Nuestra Historia
        </button>
      </div>
    </div>

    <!-- Decoración flotante -->
    <div class="hero__decoration" aria-hidden="true">
      <div class="hero__blob hero__blob--1"></div>
      <div class="hero__blob hero__blob--2"></div>
      <div class="hero__shell-ring">
        <img src="media/logo-sinfondo.png" alt="" class="hero__shell-img" />
      </div>
    </div>

  </div>

  <!-- Indicador de scroll -->
  <div class="hero__scroll" aria-hidden="true">
    <div class="hero__scroll-line"></div>
    <span class="hero__scroll-label">Descubre</span>
  </div>
